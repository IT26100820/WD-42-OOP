# Application Configuration
spring.application.name=Online Bookstore - Review and Feedback Management
server.port=8080

# Review Module Storage Settings
# File path for persistent JSON storage (relative to working directory)
app.storage.file-path=data/reviews.json

# Business Rules
# Set to true to enforce one review per customer per book; false to allow multiple
app.rules.one-review-per-customer=true

# Jackson JSON Configuration
spring.jackson.serialization.indent-output=true
spring.jackson.serialization.write-dates-as-timestamps=false

# Logging Configuration
logging.level.com.bookstore.review=INFO
logging.level.org.springframework.web=INFO
